name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ---- Mac host ----
      - name: Build DualScreenHost
        run: swift build -c release --package-path host

      - name: Package host
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          cp host/.build/release/DualScreenHost .
          tar -czf DualScreenHost-v${VERSION}-macos-arm64.tar.gz DualScreenHost

      # ---- Android client (same recipe as local builds) ----
      - name: Install Android toolchain
        run: |
          brew install -q gradle --cask android-commandlinetools || brew install -q gradle
          brew list --cask android-commandlinetools &>/dev/null || brew install -q --cask android-commandlinetools
          export JAVA_HOME=${JAVA_HOME_17_X64:-$JAVA_HOME}
          SDK=/opt/homebrew/share/android-commandlinetools
          yes | $SDK/cmdline-tools/latest/bin/sdkmanager --sdk_root=$SDK --licenses >/dev/null || true
          $SDK/cmdline-tools/latest/bin/sdkmanager --sdk_root=$SDK "platforms;android-35" "build-tools;35.0.0" "platform-tools" >/dev/null
          echo "sdk.dir=$SDK" > android/local.properties

      - name: Build APK
        working-directory: android
        run: gradle assembleRelease --no-daemon -q

      - name: Package APK
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          cp android/app/build/outputs/apk/release/app-release.apk DualScreenClient-v${VERSION}.apk

      # ---- GitHub Release (release assets bypass the artifact quota) ----
      - name: Create release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            DualScreenHost-*.tar.gz \
            DualScreenClient-*.apk \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes
