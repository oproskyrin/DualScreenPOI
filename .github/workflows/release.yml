name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Resolve package version
        run: |
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            VERSION=${GITHUB_REF_NAME#v}
          else
            VERSION=$(python3 -c 'import pathlib,re; print(re.search(r"versionName = \"([^\"]+)\"", pathlib.Path("android/app/build.gradle.kts").read_text()).group(1))')
          fi
          echo "DS_VERSION=$VERSION" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ---- Mac host ----
      - name: Test audio conversion and routing policy
        run: bash scripts/test-host-audio.sh

      - name: Test saved display placement
        run: bash scripts/test-host-layout.sh

      - name: Test connection lifecycle and persistent diagnostics
        run: bash scripts/test-host-server.sh

      - name: Test physical keyboard and pointer input
        run: bash scripts/test-host-input.sh

      - name: Test latency timing FIFO and clock sync echo
        run: bash scripts/test-host-timing.sh

      - name: Test adaptive bitrate policy
        run: bash scripts/test-host-bitrate.sh

      - name: Test codec negotiation and AVC/HEVC hardware round trips
        run: bash scripts/test-host-codec.sh

      - name: Build DualScreenHost
        run: swift build -c release --package-path host

      - name: Test bundled application lifecycle
        run: |
          bash scripts/test-host-app.sh
          python3 scripts/test-host-app-smoke.py
          python3 -m unittest discover -s tests -p test_macos_release.py -v

      - name: Package host
        run: |
          mkdir -p dist/legacy-host
          cp host/.build/release/DualScreenHost dist/legacy-host/
          ditto host/.build/artifacts/sparkle/Sparkle/Sparkle.xcframework/macos-arm64_x86_64/Sparkle.framework dist/legacy-host/Sparkle.framework
          cp host/.build/artifacts/sparkle/Sparkle/LICENSE dist/legacy-host/Sparkle-LICENSE.txt
          tar -czf DualScreenHost-v${DS_VERSION}-macos-arm64.tar.gz -C dist/legacy-host DualScreenHost Sparkle.framework Sparkle-LICENSE.txt

      # ---- Android client (same recipe as local builds) ----
      - name: Install Android toolchain
        run: |
          brew list gradle &>/dev/null || brew install -q gradle
          brew list --cask android-commandlinetools &>/dev/null || brew install -q --cask android-commandlinetools
          export JAVA_HOME=${JAVA_HOME_17_X64:-$JAVA_HOME}
          SDK=/opt/homebrew/share/android-commandlinetools
          yes | $SDK/cmdline-tools/latest/bin/sdkmanager --sdk_root=$SDK --licenses >/dev/null || true
          $SDK/cmdline-tools/latest/bin/sdkmanager --sdk_root=$SDK "platforms;android-35" "build-tools;35.0.0" "platform-tools" >/dev/null
          echo "sdk.dir=$SDK" > android/local.properties

      - name: Build native audio component
        run: |
          git clone --quiet --no-checkout https://github.com/ExistentialAudio/BlackHole.git "$RUNNER_TEMP/BlackHole"
          BLACKHOLE_SOURCE="$RUNNER_TEMP/BlackHole" BUILD_SCRATCH_ROOT="$RUNNER_TEMP" bash scripts/build-dualscreen-audio.sh

      - name: Test dynamic audio device availability
        run: |
          BLACKHOLE_SOURCE="$RUNNER_TEMP/BlackHole" BUILD_SCRATCH_ROOT="$RUNNER_TEMP" bash scripts/test-host-audio-presence.sh --hal

      - name: Build and verify complete Mac installer
        env:
          BUILD_SCRATCH_ROOT: ${{ runner.temp }}
        run: |
          bash scripts/build-macos-app.sh --version "$DS_VERSION" --host-binary host/.build/release/DualScreenHost --adb /opt/homebrew/share/android-commandlinetools/platform-tools/adb
          DUALSCREEN_TEST_ARTIFACTS=dist/macos python3 -m unittest discover -s tests -p test_macos_packaging.py -v
          # The signed appcast and immutable native assets are published from the
          # maintainer's Mac by scripts/macos_release.py; private keys stay in Keychain.

      - name: Build APK
        working-directory: android
        run: gradle assembleRelease test lint --no-daemon -q

      - name: Package APK
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk DualScreenClient-v${DS_VERSION}.apk

      # ---- GitHub Release (release assets bypass the artifact quota) ----
      - name: Create release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            DualScreenHost-*.tar.gz \
            DualScreenClient-*.apk \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes
